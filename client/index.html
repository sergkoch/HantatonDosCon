<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступный контент — проверка доступности сайтов</title>
    <meta
      name="description"
      content="Проверка доступности изображений, PDF-документов и ссылок: alt, текстовый слой, теги, /Alt, битые ссылки."
    />
    <meta name="theme-color" content="#07080c" />
    <link rel="icon" href="/logo.svg?v=1" type="image/svg+xml" />
    <script>(function(){try{var t=localStorage.getItem("theme");document.documentElement.dataset.theme=t==="light"||t==="dark"?t:"dark"}catch(e){document.documentElement.dataset.theme="dark"}})();</script>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="container site-header__inner">
          <a class="brand" href="/">
            <span class="brand__mark" aria-hidden="true">
              <img src="/logo.svg?v=1" alt="" width="34" height="34" />
            </span>
            Доступный контент
          </a>
        </div>
      </header>

      <main class="site-main" id="main">
        <div class="container">
          <h1>Проверка доступности сайтов</h1>
          <p>
            Изображения, PDF и ссылки: осмысленный <code>alt</code>, текстовый
            слой и теги PDF, битые ссылки и понятный текст ссылок.
          </p>
          <p><a href="/history">История проверок</a></p>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>Учебный проект команды. Проверка доступности контента.</p>
        </div>
      </footer>
    </div>

    <noscript>
      <p>
        Для запуска проверки нужен JavaScript. Включите его в браузере и
        обновите страницу. API доступен без JavaScript:
        <a href="/api/health">/api/health</a>.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
