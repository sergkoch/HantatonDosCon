server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Brotli: включать только если в образе есть ngx_brotli.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_static on;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_connect_timeout 10s;
    }

    location = /index.html {
        expires -1;
    }

    location = /llms.txt {
        default_type text/markdown;
        # mime.types сопоставляет .txt → text/plain, поэтому переопределяем явно.
        types { text/markdown txt; }
        expires 1h;
    }

    location = /ai-catalog.json {
        default_type application/json;
        expires 1h;
    }

    location = /.well-known/ai-catalog.json {
        default_type application/json;
        expires 1h;
    }

    location = /robots.txt {
        expires 1h;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
