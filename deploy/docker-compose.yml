services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessible
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessible"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../server
    image: accessible-api
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/accessible?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../server
    image: accessible-api
    environment:
      LISTEN: ":8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/accessible?sslmode=disable
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"

  web:
    build:
      context: ../client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
