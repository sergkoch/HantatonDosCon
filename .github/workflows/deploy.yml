name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # Пока переменная репозитория DEPLOY_ENABLED не равна true, деплой не запускается.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Репозиторий на сервере принадлежит serega, docker требует sudo.
            sudo -u serega git fetch origin main
            sudo -u serega git reset --hard origin/main

            sudo docker compose -f deploy/docker-compose.yml up -d --build
            sudo docker image prune -f

            # Ждём, пока API поднимется, и проверяем здоровье.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
                echo "deploy ok"
                exit 0
              fi
              sleep 2
            done

            echo "api did not become healthy" >&2
            exit 1
