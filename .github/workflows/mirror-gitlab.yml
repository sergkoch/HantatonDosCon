name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitHub -> GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN}" ] || [ -z "${GITLAB_REPO_URL}" ]; then
            echo "GITLAB_TOKEN / GITLAB_REPO_URL не заданы — зеркало пропущено"
            exit 0
          fi
          AUTH_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO_URL#https://}"
          git clone --mirror "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git
          git push --prune "$AUTH_URL" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
